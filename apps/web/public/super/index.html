  <script>
    (() => {
      const player = document.getElementById('player');
      const playerCover = document.getElementById('player-cover');
      const playerCoverImage = document.getElementById('player-cover-image');
      const hint = document.getElementById('player-hint');
      const lessonDownload = document.getElementById('lesson-download');
      const buttons = Array.from(document.querySelectorAll('.lesson'));

      function selectLesson(button) {
        for (const item of buttons) item.classList.remove('active');
        button.classList.add('active');
        playerCoverImage.src = button.dataset.cover;
        playerCover.classList.add('hidden');
        player.src = button.dataset.video;
        player.load();
        hint.textContent = '正在播放';
        lessonDownload.href = button.dataset.download;
        lessonDownload.download = button.dataset.lesson;
        player.scrollIntoView({ behavior: 'smooth', block: 'center' });
        void player.play().catch(() => undefined);
      }

      for (const button of buttons) {
        button.addEventListener('click', () => selectLesson(button));
      }

      playerCover.addEventListener('click', () => {
        const firstLesson = buttons[0];
        if (firstLesson) selectLesson(firstLesson);
      });
    })();
